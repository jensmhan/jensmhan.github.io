<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 70 760 530" preserveAspectRatio="xMidYMax meet" overflow="visible">
  <!-- Slabbedasken i den rotete stua. Delene med id styres av scene.js når du blar. -->
  <defs>
    <clipPath id="shirt-clip"><rect x="0" y="0" width="490" height="600"/></clipPath>
  </defs>
  <style>
    .o { stroke: #1f2328; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .ln { fill: none; stroke: #1f2328; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .skin { fill: #f2c4a0; }
    .zz { font: 800 28px Poppins, system-ui, sans-serif; fill: var(--text, #1f2328); }
    #zzz-bob { animation: bob 3s ease-in-out infinite; transform-box: fill-box; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .fly { animation: buzz 2s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes buzz {
      0%   { transform: rotate(0deg) translateX(var(--r)) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(var(--r)) rotate(-360deg); }
    }
    #glow { animation: flicker 7s steps(1) infinite; }
    @keyframes flicker { 0%, 61%, 64%, 66%, 100% { opacity: .35; } 62%, 65% { opacity: .08; } }
  </style>

  <!-- ===================== Rommet ===================== -->
  <!-- Gulv og list -->
  <rect x="-5000" y="452" width="11000" height="3000" fill="var(--scene-floor, #e4d3b8)"/>
  <rect x="-5000" y="440" width="11000" height="14" fill="var(--scene-base, #efe9de)"/>
  <path d="M-5000 440 H6000 M-5000 454 H6000" stroke="var(--scene-line, #d2bc98)" stroke-width="2"/>
  <path d="M-5000 482 H6000 M-5000 522 H6000 M-5000 580 H6000" stroke="var(--scene-line, #d2bc98)" stroke-width="2"/>
  <path d="M60 454 v28 M260 482 v40 M520 454 v28 M700 482 v40 M900 454 v28 M140 522 v58 M420 522 v58 M820 522 v58 M1000 482 v40 M-60 482 v40" stroke="var(--scene-line, #d2bc98)" stroke-width="2"/>
  <ellipse cx="80" cy="500" rx="40" ry="7" fill="#7a5a32" opacity=".18"/>
  <ellipse cx="960" cy="560" rx="30" ry="6" fill="#7a5a32" opacity=".18"/>

  <!-- Vegg: flekk, sprekk og en ubetalt regning teipet opp -->
  <path transform="translate(-170 160)" d="M318 150 q30 -16 52 4 q18 20 -6 36 q-30 14 -50 -8 q-14 -18 4 -32z" fill="#8a6a3a" opacity=".12"/>
  <path transform="translate(282 -70)" d="M598 222 l10 -24 l-8 -14 l12 -22 l-6 -18" fill="none" stroke="var(--scene-line, #d2bc98)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(-12 900 250)">
    <rect class="o" x="878" y="220" width="44" height="58" fill="#f6eec8" stroke-width="3"/>
    <path d="M884 236 h26 M884 246 h22 M884 256 h28" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <rect x="890" y="214" width="20" height="10" fill="#cfd8dc" opacity=".8"/>
  </g>

  <!-- Lyspære som henger rett ned fra taket -->
  <path d="M640 -4000 V96" stroke="#1f2328" stroke-width="3"/>
  <circle id="glow" cx="640" cy="118" r="38" fill="#ffe680" opacity=".35"/>
  <rect class="o" x="632" y="90" width="16" height="14" rx="3" fill="#6b6f78" stroke-width="3"/>
  <circle class="o" cx="640" cy="118" r="14" fill="#fff6c8" stroke-width="3"/>

  <!-- Skjevt bilde med sprukket glass -->
  <g transform="rotate(10 470 96)">
    <path d="M470 96 L414 118 M470 96 L526 118" stroke="#1f2328" stroke-width="2"/>
    <rect class="o" x="406" y="116" width="128" height="88" rx="4" fill="#8a5a2b"/>
    <rect x="418" y="128" width="104" height="64" fill="#b9def2"/>
    <circle cx="502" cy="146" r="9" fill="#ffd34d"/>
    <path d="M418 192 L448 158 L470 180 L490 162 L522 192 Z" fill="#6aa66a"/>
    <path d="M432 132 L452 160 L446 176 M452 160 L470 150" stroke="#fff" stroke-width="2" fill="none" opacity=".9"/>
  </g>
  <circle cx="470" cy="96" r="3.5" fill="#1f2328"/>

  <!-- Dartskive – han treffer ikke -->
  <circle class="o" cx="226" cy="150" r="36" fill="#1f2328"/>
  <circle cx="226" cy="150" r="28" fill="#f1e3c6"/>
  <circle cx="226" cy="150" r="20" fill="#c0392b"/>
  <circle cx="226" cy="150" r="12" fill="#f1e3c6"/>
  <circle cx="226" cy="150" r="5" fill="#2e8b57"/>
  <g stroke="#1f2328" stroke-width="3" stroke-linecap="round">
    <path d="M296 104 l18 -8"/><path d="M168 214 l-18 6"/><path d="M352 128 l18 4"/>
  </g>
  <g fill="#e74c3c" stroke="#1f2328" stroke-width="2" stroke-linejoin="round">
    <path d="M314 96 l8 -10 l4 6 z"/><path d="M150 220 l-10 -6 l-2 8 z"/><path d="M370 132 l8 -8 l3 8 z"/>
  </g>

  <!-- Hylle som henger og holder på å knekke -->
  <path class="o" d="M712 150 v18 M830 160 v16" fill="none"/>
  <path d="M700 148 Q770 172 846 158" fill="none" stroke="#1f2328" stroke-width="16" stroke-linecap="round"/>
  <path d="M700 148 Q770 172 846 158" fill="none" stroke="#a87742" stroke-width="9" stroke-linecap="round"/>
  <g transform="rotate(4 732 136)">
    <rect class="o" x="722" y="118" width="20" height="34" rx="4" fill="#c9cdd3" stroke-width="3"/>
    <rect x="724" y="128" width="16" height="14" fill="#e0a526"/>
  </g>
  <g transform="rotate(16 772 146)">
    <rect class="o" x="762" y="126" width="20" height="34" rx="4" fill="#c9cdd3" stroke-width="3"/>
    <rect x="764" y="136" width="16" height="14" fill="#e0a526"/>
  </g>
  <rect class="o" x="796" y="132" width="40" height="24" rx="2" fill="#f2efe6" stroke-width="3" transform="rotate(-6 816 144)"/>
  <g transform="rotate(8 818 134)">
    <rect class="o" x="800" y="122" width="36" height="22" rx="2" fill="#fff" stroke-width="3"/>
    <path d="M806 130 h18 M806 136 h12" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <path class="o" d="M694 152 q-6 18 2 34 q4 8 12 6 q6 -4 2 -12 q-6 -12 0 -26z" fill="#e9e6df" stroke-width="3"/>

  <!-- Søppelsekk med fluer (bak sofaen) -->
  <path class="o" d="M790 456 Q772 404 804 378 Q830 362 860 378 Q894 404 880 456 Z" fill="#3b4252"/>
  <path class="ln" d="M826 380 l-10 -16 M836 380 l12 -14" stroke-width="3.5"/>
  <path d="M806 398 q-8 20 -2 44" stroke="#5a6478" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#1f2328">
    <g class="fly" style="--r:22px; animation-duration: 2.2s"><circle cx="836" cy="346" r="3"/></g>
    <g class="fly" style="--r:15px; animation-duration: 1.6s; animation-direction: reverse"><circle cx="814" cy="358" r="2.5"/></g>
  </g>

  <!-- Klesbunke ved armlena -->
  <path class="o" d="M112 456 Q104 420 140 412 Q170 400 196 418 Q222 430 214 456 Z" fill="#4a6fa5"/>
  <path class="o" d="M126 430 Q150 408 182 420 Q196 428 190 444 Q160 452 132 446 Z" fill="#d9534f"/>
  <path class="o" d="M164 404 q14 -10 26 0 l-4 14 q-10 -6 -20 0 z" fill="#f1f1ee" stroke-width="3"/>
  <path class="ln" d="M148 422 q12 6 26 0" stroke-width="3"/>

  <!-- Teppe med flekk -->
  <ellipse cx="500" cy="538" rx="390" ry="44" fill="var(--scene-rug, #dde2ea)"/>
  <path d="M150 536 q120 -6 210 6 M640 548 q120 -8 220 0" stroke="#000" stroke-width="2" fill="none" opacity=".07"/>
  <ellipse cx="380" cy="556" rx="36" ry="8" fill="#8a6a3a" opacity=".18"/>

  <!-- ===================== Sofaen ===================== -->
  <ellipse cx="500" cy="456" rx="305" ry="9" fill="#000" opacity=".12"/>
  <rect class="o" x="252" y="426" width="16" height="30" rx="4" fill="#6b4f2a"/>
  <rect class="o" x="732" y="426" width="16" height="30" rx="4" fill="#6b4f2a"/>
  <rect class="o" x="252" y="214" width="496" height="160" rx="42" fill="#facc15"/>
  <rect class="o" x="290" y="234" width="206" height="122" rx="30" fill="#fcd94d"/>
  <rect class="o" x="504" y="234" width="206" height="122" rx="30" fill="#fcd94d"/>
  <rect class="o" x="236" y="372" width="528" height="62" rx="18" fill="#eab308"/>
  <rect class="o" x="282" y="338" width="218" height="46" rx="16" fill="#facc15"/>
  <rect class="o" x="500" y="338" width="218" height="46" rx="16" fill="#facc15"/>
  <rect class="o" x="204" y="290" width="92" height="146" rx="34" fill="#facc15"/>
  <rect class="o" x="704" y="290" width="92" height="146" rx="34" fill="#facc15"/>
  <path d="M560 400 q14 -8 26 2" stroke="#ca8a04" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ===================== Rot på gulvet foran sofaen ===================== -->
  <!-- Åpen pizzaeske med en skorpe igjen -->
  <g transform="rotate(-4 790 480)">
    <path class="o" d="M742 476 L834 476 L826 444 L750 444 Z" fill="#cfa772"/>
    <path class="o" d="M728 476 L848 476 L862 500 L714 500 Z" fill="#dcb987"/>
    <path d="M744 480 L836 480 L846 496 L732 496 Z" fill="#e9cf9f"/>
    <path class="o" d="M766 484 q24 -6 40 8 q-20 4 -40 -8z" fill="#e7a94d" stroke-width="3"/>
    <circle cx="786" cy="489" r="3" fill="#c0392b"/>
    <ellipse cx="822" cy="490" rx="8" ry="3" fill="#b98a4e" opacity=".5"/>
  </g>
  <!-- Tomme bokser -->
  <g transform="rotate(78 170 552)">
    <rect class="o" x="154" y="526" width="32" height="52" rx="6" fill="#c9cdd3"/>
    <rect x="156" y="540" width="28" height="22" fill="#e0a526"/>
  </g>
  <g transform="rotate(-20 214 520)">
    <path class="o" d="M200 498 L230 498 L226 520 L232 542 L198 542 L204 520 Z" fill="#c9cdd3"/>
    <rect x="203" y="510" width="25" height="16" fill="#e0a526"/>
  </g>
  <g transform="rotate(-90 600 474)">
    <rect class="o" x="588" y="456" width="26" height="40" rx="5" fill="#c9cdd3" stroke-width="3"/>
    <rect x="590" y="466" width="22" height="16" fill="#e0a526"/>
  </g>
  <g transform="rotate(30 900 520)">
    <path class="o" d="M886 498 L914 498 L910 518 L916 538 L884 538 L890 518 Z" fill="#c9cdd3"/>
    <rect x="889" y="508" width="23" height="15" fill="#e0a526"/>
  </g>
  <!-- Sokk -->
  <path class="o" d="M470 470 q20 -6 40 0 q14 4 10 14 q-6 8 -16 4 q-14 -6 -34 -4 q-8 -6 0 -14z" fill="#f1f1ee" stroke-width="3"/>
  <!-- Chipspose uten merke, med smuler -->
  <g transform="rotate(-14 470 584)">
    <path class="o" d="M436 566 L506 562 L510 604 L432 608 Z" fill="#e74c3c"/>
    <path d="M440 572 L504 568" stroke="#1f2328" stroke-width="3"/>
    <circle cx="470" cy="588" r="9" fill="#ffd34d"/>
  </g>
  <g fill="#f2c94c" stroke="#1f2328" stroke-width="1.5">
    <ellipse cx="530" cy="590" rx="7" ry="4"/><ellipse cx="548" cy="582" rx="6" ry="3.5"/>
    <ellipse cx="520" cy="600" rx="6" ry="3.5"/><ellipse cx="562" cy="594" rx="5" ry="3"/>
  </g>
  <!-- Spillkontroll med ledning -->
  <path d="M676 588 q40 -24 80 -10 q36 12 64 -8" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
  <path class="o" d="M610 578 q30 -10 60 0 q14 6 8 22 q-6 10 -16 2 q-6 -6 -14 -6 l-16 0 q-8 0 -14 6 q-10 8 -16 -2 q-6 -16 8 -22z" fill="#4b5563" stroke-width="3"/>
  <circle cx="660" cy="586" r="3" fill="#e74c3c"/><circle cx="668" cy="591" r="3" fill="#2ecc71"/>
  <path d="M624 588 h12 M630 582 v12" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bananskall -->
  <path class="o" d="M138 588 q10 -18 26 -14 q-8 6 -10 14 q14 -8 28 0 q-14 2 -20 10 q-10 4 -24 -10z" fill="#f4d03f" stroke-width="3"/>

  <!-- Ølpytt (vokser når boksen lander) -->
  <ellipse id="puddle" cx="836" cy="556" rx="58" ry="10" fill="#e8b23a" opacity=".85" transform="scale(0)"/>

  <!-- ===================== Slabbedasken ===================== -->
  <g id="person">
    <!-- Bena (joggebukse) -->
    <path d="M512 314 L622 296 L768 262" fill="none" stroke="#1f2328" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M512 314 L622 296 L768 262" fill="none" stroke="#7d8696" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M520 326 L630 312 L758 280" fill="none" stroke="#1f2328" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M520 326 L630 312 L758 280" fill="none" stroke="#8b93a1" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sokker, med stortåa ute -->
    <path d="M770 262 L790 222" stroke="#1f2328" stroke-width="34" stroke-linecap="round"/>
    <path d="M770 262 L790 222" stroke="#f1f1ee" stroke-width="26" stroke-linecap="round"/>
    <circle class="o skin" cx="795" cy="211" r="7"/>
    <path d="M760 280 L781 241" stroke="#1f2328" stroke-width="34" stroke-linecap="round"/>
    <path d="M760 280 L781 241" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>

    <!-- Bukselinning -->
    <rect class="o" x="488" y="292" width="64" height="58" rx="18" fill="#8b93a1"/>
    <path class="ln" d="M500 300 Q506 324 500 346" stroke-width="3"/>

    <!-- Hals – går fra hodet inn under singleten -->
    <path d="M268 288 L318 304" stroke="#1f2328" stroke-width="46" stroke-linecap="round"/>
    <path d="M268 288 L318 304" stroke="#f2c4a0" stroke-width="38" stroke-linecap="round"/>

    <!-- Overkropp i singlet, med skuldra -->
    <path class="o" d="M304 352 L304 314 Q306 282 336 276 L410 262 L410 352 Z" fill="#f5f2ea"/>
    <!-- Magen -->
    <ellipse class="o skin" cx="430" cy="294" rx="112" ry="62"/>
    <ellipse cx="430" cy="294" rx="110" ry="60" fill="#f5f2ea" clip-path="url(#shirt-clip)"/>
    <ellipse class="ln" cx="430" cy="294" rx="112" ry="62"/>
    <path class="ln" d="M490 238 Q482 296 492 354"/>
    <path class="ln" d="M512 276 q5 7 10 0" stroke-width="3"/>
    <path d="M378 252 q16 -10 30 0 q10 12 -4 20 q-14 8 -26 -2 q-10 -8 0 -18z" fill="#c9a26b" opacity=".75"/>
    <circle cx="420" cy="292" r="5" fill="#c9a26b" opacity=".6"/>
    <!-- Halsåpning i singleten -->
    <path d="M304 300 Q322 292 324 314 Q322 332 304 336 Z" fill="#f2c4a0"/>
    <path class="ln" d="M304 300 Q322 292 324 314 Q322 332 304 336" stroke-width="3.5"/>

    <!-- Hodet, hviler på armlena -->
    <circle class="o skin" cx="236" cy="278" r="9"/>
    <circle class="o skin" cx="272" cy="270" r="40"/>
    <path class="ln" d="M240 252 q2 -22 20 -18 q6 -14 22 -6 q10 -8 20 6" stroke-width="5"/>
    <path class="ln" d="M248 256 q12 -8 20 -4 M278 252 q10 -6 20 2" stroke-width="3.5"/>
    <g fill="#1f2328" opacity=".35">
      <circle cx="250" cy="292" r="1.8"/><circle cx="258" cy="298" r="1.8"/><circle cx="268" cy="302" r="1.8"/>
      <circle cx="278" cy="302" r="1.8"/><circle cx="288" cy="298" r="1.8"/><circle cx="296" cy="291" r="1.8"/>
      <circle cx="246" cy="284" r="1.8"/><circle cx="262" cy="306" r="1.8"/><circle cx="276" cy="308" r="1.8"/>
    </g>
    <path class="ln" d="M254 308 q20 10 38 -2" stroke-width="3.5"/>
    <g id="eyes-sleepy">
      <path class="ln" d="M249 266 q8 -3 16 0 M277 266 q8 -3 16 0" stroke-width="3.5"/>
      <path d="M252 267 a5 3.5 0 0 0 10 0z M280 267 a5 3.5 0 0 0 10 0z" fill="#1f2328"/>
    </g>
    <g id="eyes-shock" opacity="0">
      <circle class="o" cx="257" cy="266" r="8" fill="#fff" stroke-width="3"/>
      <circle class="o" cx="286" cy="266" r="8" fill="#fff" stroke-width="3"/>
      <circle cx="257" cy="267" r="3" fill="#1f2328"/><circle cx="286" cy="267" r="3" fill="#1f2328"/>
    </g>
    <circle class="o" cx="272" cy="281" r="7" fill="#e8907a" stroke-width="3"/>
    <g id="mouth-sleepy">
      <path class="ln" d="M262 294 q10 7 20 -1" stroke-width="3.5"/>
      <path d="M279 296 q2 8 -1 10 q-4 -2 -2 -9z" fill="#bfe3f5" stroke="#1f2328" stroke-width="1.5"/>
    </g>
    <ellipse id="mouth-shock" cx="272" cy="297" rx="6" ry="8" fill="#1f2328" opacity="0"/>

    <!-- Armen med ølen -->
    <path d="M336 300 L358 334 L402 268" fill="none" stroke="#1f2328" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M336 300 L358 334 L402 268" fill="none" stroke="#f2c4a0" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Armen som henger ned (svinger når han faller) -->
    <g id="arm">
      <path d="M348 330 L352 390 L354 440" fill="none" stroke="#1f2328" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M348 330 L352 390 L354 440" fill="none" stroke="#f2c4a0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="o skin" cx="355" cy="448" r="14"/>
      <path class="ln" d="M348 454 v6 M356 456 v6" stroke-width="3"/>
    </g>

    <!-- Zzz -->
    <g id="zzz"><g id="zzz-bob">
      <text class="zz" x="310" y="214">z</text>
      <text class="zz" x="334" y="190" style="font-size:22px">z</text>
      <text class="zz" x="354" y="170" style="font-size:16px">z</text>
    </g></g>
  </g>

  <!-- Ølboksen (uten merke) -->
  <g id="beer">
    <rect class="o" x="396" y="198" width="34" height="60" rx="6" fill="#c9cdd3"/>
    <rect x="398" y="214" width="30" height="28" fill="#e0a526"/>
    <path d="M404 222 h18 M404 232 h12" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <ellipse class="o" cx="413" cy="200" rx="15" ry="4" fill="#e3e6ea" stroke-width="3"/>
  </g>

  <!-- Fingrene rundt boksen -->
  <g id="grip">
    <rect class="o skin" x="392" y="238" width="40" height="26" rx="12"/>
    <path class="ln" d="M405 242 v12 M418 242 v12" stroke-width="3"/>
  </g>

  <!-- DUNK! -->
  <g id="dunk" opacity="0">
    <text x="660" y="420" text-anchor="middle" style="font: 900 46px Poppins, system-ui, sans-serif; paint-order: stroke; stroke: #1f2328; stroke-width: 8px; stroke-linejoin: round;" fill="#facc15">DUNK!</text>
  </g>
</svg>
