<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slabbedask</title>
  <meta name="description" content="Slabbedask.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1f2328;
      --muted: #5c6370;
      --accent: #2563eb;
      --border: #e5e7eb;
      --scene-floor: #e4d3b8;
      --scene-line: #d2bc98;
      --scene-base: #efe9de;
      --scene-rug: #dde2ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --accent: #60a5fa;
        --border: #262a33;
        --scene-floor: #1e1b17;
        --scene-line: #2b2620;
        --scene-base: #181b21;
        --scene-rug: #1a1f28;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 16px; }

    /* Slabbedasken i bakgrunnen (tegnet i scene.svg, styrt av scene.js) */
    #scene {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 0;
      height: min(74vh, 90vw);
      pointer-events: none;
    }
    #scene svg { display: block; width: 100%; height: 100%; overflow: visible; }
    /* Tom plass å bla gjennom mens han faller ut av sofaen */
    .scroll-room { height: 200vh; }

    header { padding: 64px 0 32px; }
    h1.logo { margin: 0 0 16px; line-height: 0; }
    h1.logo img { height: 56px; width: auto; max-width: 100%; }
    .lead { color: var(--muted); font-size: 1.15rem; margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { padding: 12px 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <h1 class="logo"><img src="/logo.svg" alt="Slabbedask" width="276" height="56"></h1>
      <p class="lead">Velkommen din forbanna slabbedask!</p>
    </header>

    <div class="scroll-room" aria-hidden="true"></div>

    <footer>
      © <span id="year"></span> Slabbedask
    </footer>
  </div>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="/scene.js" defer></script>
</body>
</html>
