<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borte vekk – Slabbedask</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1f2328;
      --muted: #5c6370;
      --accent: #2563eb;
      --border: #e5e7eb;
      --sofa: #facc15;
      --sofa-dark: #eab308;
      --gulv: #e4d3b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --accent: #60a5fa;
        --border: #262a33;
        --gulv: #1e1b17;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    main { max-width: 560px; padding: 80px 16px 32px; }
    svg { display: block; width: min(420px, 100%); height: auto; margin: 0 auto 20px; overflow: visible; }
    h1 { margin: 0; font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.15; font-weight: 900; }
    p { margin: 12px 0 0; color: var(--muted); }
    .knapper { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .knapp {
      font: inherit; font-weight: 700; text-decoration: none;
      padding: 10px 22px; border-radius: 999px;
      border: 2px solid #1f2328; background: var(--sofa); color: #1f2328;
    }
    .knapp:hover { background: var(--sofa-dark); }
    .knapp.nei { background: var(--bg); color: var(--text); border-color: var(--border); }
    .knapp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .lapp-tekst { font: 800 17px system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <!-- Tom sofa med en lapp: han har gått. Eller ligger et annet sted. -->
    <svg viewBox="0 0 420 240" aria-hidden="true">
      <!-- Gulvet sofaen står på -->
      <defs><linearGradient id="gulv" x1="0" x2="1"><stop offset="0" stop-color="var(--gulv)" stop-opacity="0"/><stop offset=".25" stop-color="var(--gulv)"/><stop offset=".75" stop-color="var(--gulv)"/><stop offset="1" stop-color="var(--gulv)" stop-opacity="0"/></linearGradient></defs>
      <rect x="-60" y="236" width="540" height="22" rx="11" fill="url(#gulv)"/>
      <ellipse cx="210" cy="238" rx="170" ry="6" fill="#000" opacity=".12"/>
      <g stroke="#1f2328" stroke-width="4" stroke-linejoin="round">
        <rect x="58" y="226" width="12" height="14" rx="3" fill="#6b4f2a"/>
        <rect x="350" y="226" width="12" height="14" rx="3" fill="#6b4f2a"/>
        <rect x="60" y="96" width="300" height="100" rx="30" fill="#facc15"/>
        <rect x="82" y="108" width="124" height="76" rx="22" fill="#fcd94d"/>
        <rect x="214" y="108" width="124" height="76" rx="22" fill="#fcd94d"/>
        <rect x="50" y="186" width="320" height="42" rx="14" fill="#eab308"/>
        <rect x="76" y="166" width="134" height="30" rx="12" fill="#facc15"/>
        <rect x="210" y="166" width="134" height="30" rx="12" fill="#facc15"/>
        <rect x="30" y="140" width="56" height="94" rx="24" fill="#facc15"/>
        <rect x="334" y="140" width="56" height="94" rx="24" fill="#facc15"/>
      </g>
      <!-- Gropa der han lå -->
      <path d="M100 172 q50 10 100 0" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
      <!-- Lappen -->
      <g transform="rotate(-6 250 70)">
        <path d="M250 22 v26" stroke="#6b4f2a" stroke-width="3"/>
        <rect x="186" y="44" width="128" height="58" rx="4" fill="#fffbea" stroke="#1f2328" stroke-width="3"/>
        <text class="lapp-tekst" x="250" y="69" text-anchor="middle" fill="#1f2328">STRAKS</text>
        <text class="lapp-tekst" x="250" y="91" text-anchor="middle" fill="#c0392b">TILBAKE</text>
      </g>
      <!-- Tom ølboks og en sokk -->
      <g transform="rotate(80 150 220)"><rect x="140" y="204" width="20" height="32" rx="4" fill="#c9cdd3" stroke="#1f2328" stroke-width="3"/><rect x="142" y="212" width="16" height="12" fill="#e0a526"/></g>
      <path d="M280 222 q14 -4 28 0 q10 3 7 10 q-4 6 -11 3 q-10 -4 -24 -3 q-6 -4 0 -10z" fill="#f1f1ee" stroke="#1f2328" stroke-width="3"/>
    </svg>
    <h1>Borte vekk.</h1>
    <p>Siden du lette etter finnes ikke. Den ligger sikkert under sofaen, sammen med fjernkontrollen og den andre sokken.</p>
    <div class="knapper">
      <a class="knapp" href="/">Tilbake til sofaen</a>
      <a class="knapp nei" href="/bakside.html">Se under sofaen</a>
    </div>
  </main>
  <script src="/merker.js" defer></script>
  <script>addEventListener("DOMContentLoaded", () => window.slabbe && setTimeout(() => slabbe.merke("borte"), 600));</script>
</body>
</html>
